---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: &app breezewiki
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 2.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        annotations:
          note: "breezewiki runs as root (upstream docker-compose); see pod securityContext"
        replicas: 1
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: quay.io/pussthecatorg/breezewiki
              tag: latest
              imagePullPolicy: Always
            imagePullPolicy: Always
        pod:
          # The image ships its Racket packages in root's user-site
          # (/root/.local/share/racket/.../pkgs) and /app is root-owned, so the
          # container must run as root — the upstream docker-compose does the
          # same (no USER in the Dockerfile). Running as a non-root uid makes
          # `require typed/ini` fail (packages invisible) and the app cannot
          # create /app/storage.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
    ingress:
      main:
        enabled: true
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hosts:
          - host: &host "breezewiki.${SECRET_DOMAIN}"
            paths: &paths
              - path: /
                service:
                  name: main
                  port: http
        tls:
          - hosts:
              - *host
    service:
      main:
        ports:
          http:
            # app listens on 10416 (image EXPOSE / config.ini port); the old
            # value of 3000 pointed at a closed port -> permanent 503
            port: 10416
            targetPort: 10416
    persistence:
      config:
        enabled: true
        type: configMap
        name: breezewiki-config
        globalMounts:
          - subPath: config.ini
            path: /app/config.ini
      # wiki data (SQLite) lives in /app/storage; must survive pod restarts
      storage:
        enabled: true
        mountPath: /app/storage
        storageClass: longhorn
        size: 1Gi
        retain: true
        accessMode: "ReadWriteOnce"
