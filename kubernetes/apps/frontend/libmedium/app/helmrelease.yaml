---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app libmedium
  namespace: frontend
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 2.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: realaravinth/libmedium
              tag: master
              imagePullPolicy: Always
            imagePullPolicy: Always
            ports:
              - containerPort: 7000
                name: http
                protocol: TCP
    ingress:
      main:
        enabled: true
        className: external
        annotations:
          hajimari.io/enable: 'true'
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hosts:
          - host: &host "libmedium.${SECRET_DOMAIN}"
            paths: &paths
              - path: /
                service:
                  name: main
                  port: http
        tls:
          - hosts:
              - *host
    service:
      main:
        ports:
          http:
            port: 7000
    persistence:
      config:
        enabled: true
        type: configMap
        name: libmedium-config
        globalMounts:
          - subPath: config.toml
            path: /etc/libmedium/config.toml
