---
apiVersion: v1
kind: Namespace
metadata:
  name: wg-easy
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # wg-easy must set net.ipv4.* sysctls itself and runs privileged
    # (see the chart README), so the namespace must allow privileged pods
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
