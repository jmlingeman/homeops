---
# Full-object patch (client-side apply) for the HelmRelease-owned StatefulSet.
# The STS has no kubectl last-applied baseline (Helm keeps its own state), so
# the flux client-side merge needs a complete copy of the current spec to
# stay valid (selector/labels match; immutable spec fields not dropped); the
# only delta vs Helm's object is the postStart hook below.
#
# Why the hook: wg-easy's WireGuard config gives every client peer
# `AllowedIPs = <ip>, 10.8.0.0/24, 192.168.1.0/24` so phones can reach the
# home LAN through the tunnel. When the kernel loads wg0 it installs
# `192.168.1.0/24 dev wg0` into the POD's main routing table, so every reply
# the pod sends to a LAN address (including NodePort SYN-ACKs) is routed into
# the WireGuard tunnel toward the phones instead of to the actual client —
# all LAN->pod connections (NodePort 30201 UI, 30200 UDP) time out, while
# other pods are unaffected.
#
# The postStart hook maintains five things inside the pod netns:
# (a) it continuously removes the 192.168.1.0/24 route (see above), so
#     pod->LAN replies follow the default route via eth0 (pod network ->
#     node -> LAN) instead of being sent into the WireGuard tunnel.
# (b) it removes any `default dev wg0` (v4+v6) route. Full-tunnel clients
#     (AllowedIPs = 0.0.0.0/0, ::/0 — e.g. JessePhone3, Nov 2026) make the
#     kernel install such a default route when wg0 is (re)loaded; if it
#     survives alongside the eth0 default, the pod's own egress (UI/API on
#     :51821 via NodePort, metrics) can flap onto the tunnel. Client->external
#     forwarding does NOT need it: phone packets with public destinations
#     still match the single `default via ... dev eth0` and get masqueraded
#     out on eth0; only return traffic needs the 10.8.0.0/24 dev wg0 route.
# (d) it flushes wg-quick's full-tunnel policy routing: any client with
#     AllowedIPs = 0.0.0.0/0, ::/0 (JessePhone3, since Oct 2026) makes
#     wg-quick install `default dev wg0` in routing table 51820 plus the
#     policy rules `not from all fwmark 0xca6c lookup 51820` (v4+v6) in the
#     POD's netns. Those rules send ALL unmarked egress — the pod's own
#     connections AND forwarded VPN client traffic to external sites — into
#     the tunnel; external packets loop back toward the sending phone and
#     black-hole ("external websites hang, internal works" — the Nov 2026
#     incident; surfaced when the Nov-16 pod recreation reloaded the config
#     with the full-tunnel peer for the first time in a live netns).
#     Flushing table 51820 + deleting the fwmark rules keeps split-tunnel
#     forwarding intact and lets full-tunnel clients' external traffic
#     egress via eth0 + masquerade. Legitimate client return traffic is
#     unaffected: it arrives on wg0 and matches the 10.8.0.0/24 route.
# (e) it keeps an nftables MASQUARDE rule for 10.8.0.0/24 -> eth0 in place.
#     The app (v15, Node-based) installs its own MASQUARDE rule in the
#     legacy iptables table at startup (the older image relied on the
#     wg0.conf PostUp hooks, which the API-based config skips entirely),
#     but if that rule ever disappears (client reload, image change) the
#     hook restores NAT via nft. Without any masquerade, VPN client ->
#     LAN packets would leave with the client's 10.8.0.x source and LAN
#     replies (sent to the home router, which has no 10.8.0.0/24 route)
#     would be dropped. With it, replies address the pod's k8s IP and
#     return via the home router's static routes
#     (10.42.0.0/24 -> 192.168.1.20, 10.42.1.0/24 -> 192.168.1.21)
#     into this netns, where conntrack un-masquerades them to 10.8.0.x.
#     The 10.8.0.0/24 route itself stays; client->LAN forwarding through
#     the server keeps working.
# (f) it stamps Cilium's skip-NAT fwmark (0x00000a00) onto packets bound
#     for the LBIPAM VIPs 192.168.1.23-26. The node's CILIUM_POST_nat
#     chain accepts marked packets without masquerading them: without
#     this, forwarded tunnel-client traffic re-SNAT'd to the node IP
#     (e.g. 192.168.1.20) is treated by the peer node's Cilium as trusted
#     inter-node traffic, skips LoadBalancer DNAT, and blackholes at the
#     wire (offsite VPN DNS dead while direct-IP access worked — the
#     2026-11-25/26 incident; pcap-proven: the worker re-emitted every
#     phone query back out of ens18 with no LB event). With the pod
#     source IP preserved on the wire, the peer node's BPF LB DNATs and
#     returns the reply to the pod IP, which this netns un-masquerades
#     back to 10.8.0.x and delivers over wg0.
#     IMPORTANT: on the host side the exemption rule must be a `return`
#     placed ABOVE the `saddr <podCIDR> masquerade` rule in CILIUM_POST_nat
#     — Cilium ships it as an `accept` below the masquerade rule, which is
#     inert (`accept` does not stop chain evaluation, and it is ordered
#     last). ip-masq-agent re-breaks the ordering on agent restart, so the
#     cilium-nat-skip-guard DaemonSet (kube-system) rebuilds the chain
#     within ~5s of any regression. See docs/wireguard-offsite-vpn.md,
#     "November 2026 incident".
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wg-easy
  namespace: wg-easy
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: wg-easy
      app.kubernetes.io/name: wg-easy
  serviceName: ''
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: wg-easy
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: wg-easy
        app.kubernetes.io/version: 15.3.0
        helm.sh/chart: wg-easy-1.2.0
    spec:
      containers:
      - env:
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: '51821'
        - name: INSECURE
          value: 'true'
        - name: DISABLE_IPV6
          value: 'true'
        - name: ENABLE_PROMETHEUS_METRICS
          value: 'true'
        - name: INIT_ENABLED
          value: 'true'
        - name: INIT_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: wg-easy-secret
        - name: INIT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: wg-easy-secret
        - name: INIT_PORT
          value: '30200'
        - name: INIT_HOST
          value: 192.168.1.20
        - name: INIT_DNS
          value: 192.168.1.23
        - name: INIT_IPV4_CIDR
          value: 10.8.0.0/24
        - name: INIT_IPV6_CIDR
          value: 2001:0DB8::/32
        image: ghcr.io/wg-easy/wg-easy:15.4.0@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - ip link show dev wg0 | grep -s up
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: wg-easy
        ports:
        - containerPort: 30200
          name: udp-wireguard
          protocol: UDP
        - containerPort: 51821
          name: http-ui
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - ip link show dev wg0 | grep -s up
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
          privileged: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - ip link show dev wg0 | grep -s up
          failureThreshold: 10
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/wireguard
          name: wg-easy
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - nohup sh -c 'while :; do ip route del 192.168.1.0/24 dev wg0 2>/dev/null; ip route del default dev wg0 2>/dev/null; ip -6 route del default dev wg0 2>/dev/null; ip -4 route flush table 51820 2>/dev/null; ip -4 rule del not from all fwmark 0xca6c lookup 51820 2>/dev/null; ip -6 route flush table 51820 2>/dev/null; ip -6 rule del not from all fwmark 0xca6c lookup 51820 2>/dev/null; nft add table ip nat 2>/dev/null; nft list chain ip nat masq_post 2>/dev/null | grep -q masquerade || { nft delete chain ip nat masq_post 2>/dev/null; nft add chain ip nat masq_post "{ type nat hook postrouting priority 100; policy accept; }" 2>/dev/null; nft add rule ip nat masq_post ip saddr 10.8.0.0/24 oifname eth0 masquerade 2>/dev/null; }; nft add table ip mangle 2>/dev/null; nft list ruleset ip mangle 2>/dev/null | grep -q "meta mark set" || { nft delete table ip mangle 2>/dev/null; nft add table ip mangle; nft add chain ip mangle vip_no_node_masq "{ type filter hook postrouting priority 300; policy accept; }"; nft add rule ip mangle vip_no_node_masq ip daddr { 192.168.1.23, 192.168.1.24, 192.168.1.25, 192.168.1.26 } meta mark set 0x00000a00; }; sleep 5; done' >/dev/null 2>&1 &
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: wg-easy
      serviceAccountName: wg-easy
      terminationGracePeriodSeconds: 30
      volumes:
      - name: wg-easy-secret
        secret:
          defaultMode: 420
          secretName: wg-easy-secret
      - name: wg-easy
        persistentVolumeClaim:
          claimName: wg-easy
  updateStrategy:
    type: RollingUpdate
