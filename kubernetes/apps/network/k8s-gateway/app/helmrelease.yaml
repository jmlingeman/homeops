---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 30m
  chart:
    spec:
      chart: k8s-gateway
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    # k8s-gateway IS cluster DNS (10.43.0.10): its own readiness probe and every
    # other pod's DNS-based checks deadlock while it rolls, so helm --wait can
    # never succeed. Upgrade without waiting; watch pod health manually.
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ip: "192.168.1.23"
      externalTrafficPolicy: Cluster
    # The upstream image quay.io/oriedge/k8s_gateway:v0.4.0 was deleted from
    # quay.io (discovered 2026-10-04; the repo has been dormant since 2025-07).
    # Only the k3s primary still has the image in its local containerd cache,
    # so pin the pod there (pullPolicy IfNotPresent makes this a cache hit).
    # If this image source is ever restored/mirrored, the pin can be relaxed.
    nodeSelector:
      kubernetes.io/hostname: kube-controller
