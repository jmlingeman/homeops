---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 30m
  chart:
    spec:
      chart: k8s-gateway
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    # k8s-gateway IS cluster DNS (10.43.0.10): its own readiness probe and every
    # other pod's DNS-based checks deadlock while it rolls, so helm --wait can
    # never succeed. Upgrade without waiting; watch pod health manually.
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    # The k8s_gateway plugin is authoritative for the zone and answered NXDOMAIN
    # for any name not backed by a watched k8s resource. Off-LAN VPN clients
    # (phone DNS = Pi-hole .10 -> .23, "LAN view") therefore could never resolve
    # public *.jesseisageek.com names. Fallthrough forwards unknown zone names
    # to the upstream forwarder so they resolve to public records.
    fallthrough:
      enabled: true
      zones:
        - "${SECRET_DOMAIN}"
    image:
      # The upstream image was deleted from quay.io (discovered 2026-10-04;
      # the project has been dormant since 2025-07). This is a rebuild from
      # the v0.4.0 git tag (digest sha256:fb67d7fd…), mirrored on Docker Hub.
      registry: docker.io
      repository: smidget2k4/k8s_gateway
      tag: v0.4.0
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ip: "192.168.1.23"
      externalTrafficPolicy: Cluster
