---
# cilium-nat-skip-guard
#
# WHY THIS EXISTS (incident 2026-11-26):
#   The offsite WireGuard VPN (wg-easy) keeps a MASQUARDE rule in the pod's
#   netns and stamps Cilium's skip-NAT fwmark (0x00000a00) on packets bound
#   for the in-tunnel DNS server (192.168.1.23), so that after leaving the
#   pod's netns the HOST's nftables do NOT masquerade them back to the node
#   IP. If the host masquerades them anyway, the peer node's BPF load
#   balancer treats the return traffic as inter-node (node-IP-source)
#   traffic and blackholes it: offsite clients' DNS (and everything using
#   the tunnel's DNS) times out while direct-IP LAN access still works.
#
#   The host-side chain CILIUM_POST_nat (managed by ip-masq-agent via the
#   iptables-nft backend) ships the mark exemption as an `accept` rule —
#   which is doubly wrong:
#     1. `accept` does not stop evaluation, so even correctly ordered it
#        would not prevent the later masquerade rule from firing. The rule
#        must be a `return`.
#     2. Cilium orders it AFTER the `saddr <podCIDR> masquerade` rule, so
#        it is unreachable for exactly the traffic it is meant to protect.
#
#   ip-masq-agent rebuilds CILIUM_POST_nat on agent restart / config change
#   and re-introduces both defects. This DaemonSet runs on every node and
#   keeps the chain in the correct shape: if the mark-RETURN rule is missing
#   or sits below the masquerade rule, the chain is rebuilt (parameters are
#   parsed from the existing rules first) with the return rule at the top.
#
# NOTE: the wg-easy image is reused only because it is already present on
# both nodes and contains nftables + shell; it is idle in this workload.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cilium-nat-skip-guard
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cilium-nat-skip-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilium-nat-skip-guard
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: guard
          image: ghcr.io/wg-easy/wg-easy:15.5.0@sha256:071f79a639e9361123a5e57733107320207b844ddbbd92dfa6962f541fe8aac8
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN"]
          command:
            - /bin/sh
            - -c
            - |
              set -u
              fix() {
                LIST=$(nft -a list chain ip nat CILIUM_POST_nat 2>/dev/null) || return 0
                CIDR=$(printf '%s\n' "$LIST" | grep 'masquerade' | grep -o 'ip saddr [0-9./]*' | head -1 | awk '{print $3}')
                GW=$(printf '%s\n' "$LIST" | grep 'snat to' | grep -o 'snat to [0-9.]*' | head -1 | awk '{print $3}')
                MARKIDX=$(printf '%s\n' "$LIST" | grep -n '0x00000a00 return' | head -1 | cut -d: -f1)
                MASQIDX=$(printf '%s\n' "$LIST" | grep -n 'masquerade' | head -1 | cut -d: -f1)
                if [ -n "$MARKIDX" ] && [ -n "$MASQIDX" ] && [ "$MARKIDX" -lt "$MASQIDX" ]; then
                  return 0
                fi
                echo "cilium-nat-skip-guard: CILIUM_POST_nat ordering broken (mark=${MARKIDX:-missing} masq=${MASQIDX:-missing}), rebuilding"
                for h in $(nft -a list chain ip nat POSTROUTING 2>/dev/null | grep 'jump CILIUM_POST_nat' | grep -o 'handle [0-9]*' | awk '{print $2}'); do
                  nft delete rule ip nat POSTROUTING handle "$h" 2>/dev/null
                done
                for h in $(nft -a list chain ip nat CILIUM_POST_nat 2>/dev/null | grep -o 'handle [0-9]*' | awk '{print $2}'); do
                  nft delete rule ip nat CILIUM_POST_nat handle "$h" 2>/dev/null
                done
                nft delete chain ip nat CILIUM_POST_nat 2>/dev/null
                nft add chain ip nat CILIUM_POST_nat 2>/dev/null || return 0
                nft add rule ip nat CILIUM_POST_nat 'meta mark & 0x00000e00 == 0x00000a00 return' 2>/dev/null
                [ -n "${CIDR:-}" ] && nft add rule ip nat CILIUM_POST_nat "oifname != \"cilium_*\" ip saddr ${CIDR} ip daddr != 10.42.0.0/16 masquerade" 2>/dev/null
                [ -n "${GW:-}" ] && nft add rule ip nat CILIUM_POST_nat "oifname \"lxc*\" ip saddr 127.0.0.1 snat to ${GW}" 2>/dev/null
                nft add rule ip nat POSTROUTING jump CILIUM_POST_nat 2>/dev/null
                echo "cilium-nat-skip-guard: rebuilt CILIUM_POST_nat (cidr=${CIDR:-?} snat=${GW:-?})"
              }
              while :; do
                fix
                sleep 5
              done
