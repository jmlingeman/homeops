---
# SNATs wg-easy pod egress traffic (i.e. VPN phone traffic, masqueraded to the
# pod IP by the pod's own nft rules) to the node's LAN IP before it leaves the
# cluster. Required because the home router only accepts LAN-sourced frames:
# pod-sourced (10.42.0.0/16) packets are dropped for every LAN destination
# except the k8s-gateway VIP. Cilium's BPF "host routing" fast path (fib
# redirect) bypasses node iptables, so node-level MASQUERADE rules do not
# apply to this traffic — the egress gateway is the in-BPF SNAT point.
#
# Excluded CIDRs keep in-cluster traffic (pods, services) and the WireGuard
# peer range untouched, preserving pod-to-pod, cluster-DNS, and
# nodeport service behavior for this pod.
apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata:
  name: wg-easy-phone-egress
spec:
  egressGateway:
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: kube-worker
    egressIP: 192.168.1.21
  destinationCIDRs:
    - 0.0.0.0/0
  excludedCIDRs:
    - 10.42.0.0/16 # pod CIDR
    - 10.43.0.0/16 # service CIDR
    - 10.8.0.0/24 # WireGuard phone peers
  selectors:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: wg-easy
