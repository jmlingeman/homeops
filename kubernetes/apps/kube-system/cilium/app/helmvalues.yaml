---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-values
data:
  values.yaml: |
    autoDirectNodeRoutes: true
    bpf:
      # eBPF NAT (SNAT/DNAT) on the fast path (observed on 1.16.19) can corrupt
      # UDP checksums; phone (WireGuard) traffic must exit with a valid checksum.
      # Kept off on 1.17.x too - harmless, and the VPN depends on it.
      masquerade: false
      # force the kernel (stack) routing path so node nft MASQUERADE applies
      hostLegacyRouting: true
      # 2026-11-24: allow per-service forwarding mode (Cilium >= 1.17) via the
      # service.cilium.io/forwarding-mode annotation. The global mode is
      # 'datamodel' (global 'snat' on 1.16 blackholed external-origin TCP to
      # every NodePort/VIP frontend); the WireGuard VIP services (.24/.25/.26)
      # opt back into 'snat' per-service. See docs/wireguard-offsite-vpn.md.
      lbModeAnnotation: true
    bgp:
      enabled: false
    cluster:
      name: home-cluster
      id: 1
    endpointRoutes:
      enabled: true
    hubble:
      enabled: true
      metrics:
        enabled:
          - dns:query
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - http
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: Cilium
      relay:
        enabled: true
        rollOutPods: true
        prometheus:
          serviceMonitor:
            enabled: true
      ui:
        enabled: true
        rollOutPods: true
        ingress:
          enabled: true
          className: internal
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/group: Network
            gethomepage.dev/name: Cilium
            gethomepage.dev/icon: cilium.png
          hosts:
            - "hubble.${SECRET_DOMAIN}"
          tls:
            - hosts:
                - "hubble.${SECRET_DOMAIN}"
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: "${CLUSTER_CIDR}"
    k8sClientRateLimit:
      # https://github.com/cilium/cilium/issues/26586 - prevent L2 lease renewal
      # starvation of the agent's k8s client after API outages (reboot scenario)
      qps: 200
      burst: 400
    k8sServiceHost: "${KUBEAPI_ADDR}"
    k8sServicePort: 6443
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
      # https://github.com/cilium/cilium/issues/26586
      leaseDuration: 120s
      leaseRenewDeadline: 60s
      leaseRetryPeriod: 1s
    loadBalancer:
      algorithm: maglev
      # Required on Cilium >= 1.17 when bpf.lbModeAnnotation: true: the agent
      # refuses to start (daemon/cmd/kube_proxy_replacement.go) unless
      # --bpf-lb-dsr-dispatch=ipip. Inert for us (nodePortMode=snat); IPIP
      # dispatch only matters for DSR services.
      dsrDispatch: ipip
      mode: datamodel
    localRedirectPolicy: true
    operator:
      replicas: 1
      rollOutPods: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Cilium
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Cilium
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      privileged: true
