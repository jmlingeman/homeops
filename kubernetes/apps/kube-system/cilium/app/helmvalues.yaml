---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-values
data:
  values.yaml: |
    autoDirectNodeRoutes: true
    bpf:
      # 1.16.19 BPF NAT (SNAT/DNAT) corrupts UDP checksums on the fast path;
      # phone (WireGuard) traffic must exit with a valid UDP checksum.
      masquerade: false
      # force the kernel (stack) routing path so node nft MASQUERADE applies
      hostLegacyRouting: true
    # Exclude the LBIPAM VIPs from node-level masquerade. If tunnel-client
    # traffic is re-SNAT'd to a node IP (e.g. 192.168.1.20) on the way out,
    # the other node's Cilium treats it as trusted inter-node traffic and
    # SKIPS LoadBalancer DNAT -> DNS/VIP queries blackhole at the wire while
    # direct-LAN-IP access keeps working (2026-11-25/26 offsite incident).
    # With pod-src preserved the remote node's BPF LB DNATs normally and the
    # DSR/SNAT reply returns to the pod IP (verified end-to-end).
    bpfMasqueradeRange:
      - 192.168.1.23/32
      - 192.168.1.24/32
      - 192.168.1.25/32
      - 192.168.1.26/32
    bgp:
      enabled: false
    cluster:
      name: home-cluster
      id: 1
    endpointRoutes:
      enabled: true
    hubble:
      enabled: true
      metrics:
        enabled:
          - dns:query
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - http
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: Cilium
      relay:
        enabled: true
        rollOutPods: true
        prometheus:
          serviceMonitor:
            enabled: true
      ui:
        enabled: true
        rollOutPods: true
        ingress:
          enabled: true
          className: internal
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/group: Network
            gethomepage.dev/name: Cilium
            gethomepage.dev/icon: cilium.png
          hosts:
            - "hubble.${SECRET_DOMAIN}"
          tls:
            - hosts:
                - "hubble.${SECRET_DOMAIN}"
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: "${CLUSTER_CIDR}"
    k8sClientRateLimit:
      # https://github.com/cilium/cilium/issues/26586 - prevent L2 lease renewal
      # starvation of the agent's k8s client after API outages (reboot scenario)
      qps: 200
      burst: 400
    k8sServiceHost: "${KUBEAPI_ADDR}"
    k8sServicePort: 6443
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
      # https://github.com/cilium/cilium/issues/26586
      leaseDuration: 120s
      leaseRenewDeadline: 60s
      leaseRetryPeriod: 1s
    loadBalancer:
      algorithm: maglev
      mode: dsr
    localRedirectPolicy: true
    operator:
      replicas: 1
      rollOutPods: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Cilium
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Cilium
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      privileged: true
